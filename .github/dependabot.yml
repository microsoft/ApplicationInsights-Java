version: 2
registries:
  gradle-plugin-portal:
    type: maven-repository
    url: https://plugins.gradle.org/m2
    username: "" # Required by dependabot
    password: "" # Required by dependabot
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - gradle-plugin-portal
    ignore:
      - dependency-name: "ch.qos.logback:*"
        # logback 1.4+ requires Java 11+
        versions: [ "[1.4,)" ]
      - dependency-name: "org.springframework.boot:spring-boot-gradle-plugin"
        # this is used for smoke tests
        # spring boot 3 requires Java 17, and we're not ready yet
        versions: [ "[3,)" ]
      - dependency-name: "javax.servlet:javax.servlet-api"
        # applicationinsights-web (classic sdk) is intentionally compiled and against Servlet 3.0
        versions: [ "[3.1,)" ]
      - dependency-name: "org.eclipse.jetty:jetty-servlet"
        # smoke test framework intentionally uses javax servlet (as opposed to jakarta servlet)
        versions: [ "[11,)" ]
      - dependency-name: "org.mockito:*"
        # mockito 5 requires Java 11
        versions: [ "[5,)" ]
      - dependency-name: "org.junit:junit-bom"
        # junit 6 requires Java 17
        versions: [ "[6,)" ]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # a dependency lands in the first group it matches, and whatever is left over gets its own PR,
    # so major updates are intentionally left ungrouped
    groups:
      # semconv bumps rename attributes and require test changes, so they are kept out of the
      # opentelemetry group to avoid mixing a version bump with semantic code churn
      opentelemetry-semconv:
        patterns:
          - "io.opentelemetry.semconv:*"

      # the otel sdk/instrumentation/contrib/javaagent artifacts are interdependent and need to be
      # reviewed, tested and merged together
      opentelemetry:
        patterns:
          - "otel*Version" # version properties in dependencyManagement/build.gradle.kts
          - "io.opentelemetry*"
        exclude-patterns:
          - "io.opentelemetry.semconv:*"
          # released independently of the otel sdk, and only used by the smoke test framework
          - "io.opentelemetry.proto:*"

      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          # every release adds checks that fire on existing code
          - "errorProneVersion"
          # Make AutoConfigure get its own PR that can be merged without waiting on the batch
          - "com.azure:azure-monitor-opentelemetry-autoconfigure"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/perf-tests"
    registries:
      - gradle-plugin-portal
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/etw/etw-testapp"
    registries:
      - gradle-plugin-portal
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
